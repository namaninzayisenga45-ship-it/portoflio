
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
</head>
<body style="background:#2e0707;color:white;text-align:center;padding:40px;font-family:Arial">

    <h2>Set a New Password</h2>

    <form id="resetForm">
        <input
            type="password"
            id="newPassword"
            placeholder="New password"
            minlength="6"
            required
        >

        <br><br>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            minlength="6"
            required
        >

        <br><br>

        <button type="submit" id="resetButton">Reset Password</button>
    </form>

    <p id="message"></p>

    <script type="module">
        import { createClient } from
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

        const supabase = createClient(
            "https://ohkvknhqbknocrytirbp.supabase.co",
            "sb_publishable_E_TagxG-byimvX81ZsEGOw_F-gUyL45"
        );

        const form = document.getElementById("resetForm");
        const message = document.getElementById("message");
        const button = document.getElementById("resetButton");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const password = document.getElementById("newPassword").value;
            const confirm = document.getElementById("confirmPassword").value;

            if (password !== confirm) {
                message.textContent = "Passwords do not match.";
                return;
            }

            button.disabled = true;
            message.textContent = "Updating password...";

            try {
                const { error } = await supabase.auth.updateUser({
                    password: password
                });

                if (error) throw error;

                message.textContent = "Password updated! Please log in.";
                setTimeout(() => {
                    window.location.href = "./login.html";
                }, 1500);

            } catch (error) {
                message.textContent = error.message;
                button.disabled = false;
            }
        });
    </script>

</body>
</html>
