                <div id="hya">Sign up</div>

                <form id="signupForm" action="#" method="post">

                    <div class="mynames">

                        <div class="w">

                            <label for="firstName">First name</label>

                            <input
                                type="text"
                                id="firstName"
                                name="firstName"
                                placeholder="Enter first name"
                                required
                            >

                        </div>


                        <div class="w">

                            <label for="secondName">Second name</label>

                            <input
                                type="text"
                                id="secondName"
                                name="secondName"
                                placeholder="Enter second name"
                                required
                            >

                        </div>

                    </div>


                    <div class="ema">

                        <div class="w">

                            <label for="email">Email address</label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Eg. Ablahamisac@gmail.com"
                                required
                            >

                        </div>


                        <div class="w">

                            <label for="password">Password</label>

                            <div class="password-box">

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Enter password"
                                    minlength="8"
                                    required
                                >

                                <button
                                    type="button"
                                    id="togglePassword"
                                >
                                    <img
                                        src="./seepss.png"
                                        alt="Show password"
                                    >
                                </button>

                            </div>

                        </div>

                    </div>


                    <div id="hyee">

                        <button
                            type="submit"
                            id="regibut"
                        >
                            Register
                        </button>

                    </div>

                </form>


                <div class="or-divider">

                    <span></span>

                    <p>or</p>

                    <span></span>

                </div>

                    <div id="iner">
