                <div id="hya">Sign up</div>

                <form id="signupForm" action="#" method="post">

                    <div class="mynames">

                        <div class="w">

                            <label for="firstName">First name</label>

                            <input
                                type="text"
                                id="firstName"
                                name="firstName"
                                placeholder="Enter first name"
                                required
                            >

                        </div>


                        <div class="w">

                            <label for="secondName">Second name</label>

                            <input
                                type="text"
                                id="secondName"
                                name="secondName"
                                placeholder="Enter second name"
                                required
                            >

                        </div>

                    </div>


                    <div class="ema">

                        <div class="w">

                            <label for="email">Email address</label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Eg. Ablahamisac@gmail.com"
                                required
                            >

                        </div>


                        <div class="w">

                            <label for="password">Password</label>

                            <div class="password-box">

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Enter password"
                                    minlength="8"
                                    required
                                >

                                <button
                                    type="button"
                                    id="togglePassword"
                                >
                                    <img
                                        src="./seepss.png"
                                        alt="Show password"
                                    >
                                </button>

                            </div>

                        </div>

                    </div>


                    <div id="hyee">

                        <button
                            type="submit"
                            id="regibut"
                        >
                            Register

    <script src="port.js"></script>


<script type="module">
import { createClient } from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
    "https://ohkvknhqbknocrytirbp.supabase.co",
    "sb_publishable_E_TagxG-byimvX81ZsEGOw_F-gUyL45"
);

const form = document.getElementById("signupForm");
const button = document.getElementById("regibut");

form.addEventListener("submit", async function (event) {
    event.preventDefault();

    const firstName = document.getElementById("firstName").value.trim();
    const secondName = document.getElementById("secondName").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Registering...";

    try {
        const { data, error } = await supabase.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    first_name: firstName,
                    second_name: secondName
                }
            }
        });

        if (error) throw error;

        if (data.session) {
            alert("Account created successfully! You can now log in.");
        } else {
            alert("Account created! Check your email to confirm your account, then log in.");
        }

        window.location.href = "./login.html";

    } catch (error) {
        alert(error.message || "Registration failed. Please try again.");
    } finally {
        button.disabled = false;
        button.textContent = "Register";
    }
});
</script>
