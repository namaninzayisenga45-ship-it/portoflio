<script type="module">
import { createClient } from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
    "https://ohkvknhqbknocrytirbp.supabase.co",
    "sb_publishable_E_TagxG-byimvX81ZsEGOw_F-gUyL45"
);

const form = document.getElementById("signupForm");
const button = document.getElementById("regibut");

form.addEventListener("submit", async function (event) {
    event.preventDefault();

    const firstName = document.getElementById("firstName").value.trim();
    const secondName = document.getElementById("secondName").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Registering...";

    try {
        const { data, error } = await supabase.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    first_name: firstName,
                    second_name: secondName
                }
            }
        });

        if (error) throw error;

        if (data.session) {
            alert("Account created successfully! You can now log in.");
        } else {
            alert("Account created! Check your email to confirm your account, then log in.");
        }

        window.location.href = "./login.html";

    } catch (error) {
        alert(error.message || "Registration failed. Please try again.");
    } finally {
        button.disabled = false;
        button.textContent = "Register";
    }
});
</script>

<script type="module">
import { createClient } from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
    "https://ohkvknhqbknocrytirbp.supabase.co",
    "sb_publishable_E_TagxG-byimvX81ZsEGOw_F-gUyL45"
);

const ADMIN_USER_ID = "a0dca848-6e1e-4aae-8a02-20285c697ba8";

const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("logBut");

document.getElementById("forgotPassword").addEventListener("click", async (event) => {
    event.preventDefault();

    const email = document.getElementById("loginEmail").value.trim();

    if (!email) {
        alert("Banza wandike email yawe.");
        return;
    }

    const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + "/reset-password.html"
    });

    if (error) {
        alert(error.message);
    } else {
        alert("Reba email yawe kugira ngo uhindure password.");
    }
});

loginForm.addEventListener("submit", async function (event) {
    event.preventDefault();

    loginButton.disabled = true;
    loginButton.textContent = "Signing in...";

    try {
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;

        const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password
        });

        if (error) throw error;

        if (data.user.id !== ADMIN_USER_ID) {
            await supabase.auth.signOut();
            throw new Error("This account is not the authorized admin.");
        }

        
window.location.href = "./namani-dashboard/admin.html";


    } catch (error) {
        alert(error.message);
        loginButton.disabled = false;
        loginButton.textContent = "Login";
    }
});
</script>
